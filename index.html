<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ms-ai-cert-quiz/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Practice quiz for Microsoft AI-900 and AI-102 certifications" />
    <meta name="theme-color" content="#0078D4" />
    <title>MS AI Cert Quiz</title>
    <script>
      // Handle redirect from 404.html for GitHub Pages SPA routing
      (function() {
        var redirect = sessionStorage.getItem('redirect');
        if (redirect) {
          sessionStorage.removeItem('redirect');
          var url = new URL(redirect);
          if (url.pathname !== location.pathname) {
            history.replaceState(null, null, url.pathname + url.search + url.hash);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
